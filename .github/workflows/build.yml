name: Kiosk prüfen
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '25.0.2'
          cache: maven
      - run: sh ./mvnw -B -ntp clean verify
      - name: Prüfgruppen dürfen nicht fehlen
        run: |
          for suite in RegelnTest KioskDbTest MessungTest; do
            test -s "target/surefire-reports/TEST-kiosk.$suite.xml"
          done
